services:
  db:
    image: postgres:16-bookworm
    container_name: oficina-fiap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_fiap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Duas verificações, porque cada uma cobre uma falha real:
      # 1. pg_isready -h 127.0.0.1 força TCP. Sem o -h, tanto o pg_isready
      #    quanto o psql usam o socket Unix e reportam "healthy" enquanto o
      #    Postgres ainda não aceita conexão vinda de outro container — é o
      #    P1001 que derrubava o migrate. Na criação do volume o entrypoint
      #    sobe um servidor temporário só no socket: exatamente essa janela.
      # 2. o psql confirma que o banco alvo existe. POSTGRES_DB só tem efeito
      #    na primeira criação do volume; se ela foi interrompida, o banco
      #    nunca é criado e nenhum `up` posterior conserta.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres > /dev/null 2>&1 && psql -U postgres -d ${POSTGRES_DB:-oficina_fiap} -c 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    container_name: oficina-fiap-migrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-oficina_fiap}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: build
    container_name: oficina-fiap-seed
    # `prisma db seed` executa o script sob o loader ESM, que não resolve o
    # Prisma Client gerado (.ts com imports .js). Sob require/CommonJS o
    # ts-node resolve — é a mesma invocação que o Dockerfile já usa no build.
    command:
      [
        "npx",
        "ts-node",
        "--transpile-only",
        "-e",
        "require('./prisma/seed').runSeed().catch((e) => { console.error(e); process.exit(1); })",
      ]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-oficina_fiap}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      PRISMA_CLIENT_MODULE: /app/dist/generated/prisma/client.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    container_name: oficina-fiap-api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-oficina_fiap}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:?set PAYMENT_SUCCESS_URL in .env}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:?set PAYMENT_CANCEL_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      STOCK_NOTIFICATION_EMAIL: ${STOCK_NOTIFICATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${PORT:-3000}/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
