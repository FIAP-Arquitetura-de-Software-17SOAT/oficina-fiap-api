services:
  db:
    image: postgres:16-bookworm
    container_name: oficina-fiap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_fiap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Duas verificações, porque cada uma cobre uma falha real:
      # 1. pg_isready -h 127.0.0.1 força TCP. Sem o -h, tanto o pg_isready
      #    quanto o psql usam o socket Unix e reportam "healthy" enquanto o
      #    Postgres ainda não aceita conexão vinda de outro container — é o
      #    P1001 que derrubava o migrate. Na criação do volume o entrypoint
      #    sobe um servidor temporário só no socket: exatamente essa janela.
      # 2. o psql confirma que o banco alvo existe. POSTGRES_DB só tem efeito
      #    na primeira criação do volume; se ela foi interrompida, o banco
      #    nunca é criado e nenhum `up` posterior conserta.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres > /dev/null 2>&1 && psql -U postgres -d ${POSTGRES_DB:-oficina_fiap} -c 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    container_name: oficina-fiap-migrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oficina_fiap}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    container_name: oficina-fiap-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oficina_fiap}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
