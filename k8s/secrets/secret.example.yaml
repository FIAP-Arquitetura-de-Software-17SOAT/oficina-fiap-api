# Secret da API: credenciais e tokens de servicos externos. MODELO, sem valores reais.
# Nunca versione uma copia preenchida. Base64 nao e criptografia.
#
# O Secret real e criado direto no cluster, a partir de um arquivo local CHAVE=valor
# (veja k8s/README.md). O Pod recebe cada chave como variavel de ambiente.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: "<URL de conexao com o PostgreSQL>"

  # Distintos entre si e, em producao, com pelo menos 32 bytes cada
  # (gere com: openssl rand -base64 48).
  JWT_ACCESS_SECRET: "<segredo para tokens de acesso>"
  JWT_REFRESH_SECRET: "<segredo para tokens de atualizacao>"

  # A API so aceita chave de TESTE do Stripe (sk_test_...).
  STRIPE_SECRET_KEY: "<chave da API Stripe>"
  STRIPE_WEBHOOK_SECRET: "<segredo do webhook Stripe>"

  # SMTP_USER e SMTP_PASSWORD sao opcionais, mas precisam vir juntos.
  SMTP_USER: "<usuario SMTP>"
  SMTP_PASSWORD: "<senha SMTP>"
