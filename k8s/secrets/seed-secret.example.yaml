# Secret do administrador inicial, usado so pelo Job de banco (db-setup-job.yaml).
# Fica separado do Secret da API: a API nunca recebe estas credenciais.
# MODELO, sem valores reais. Nunca versione uma copia preenchida.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-seed-secrets
  namespace: oficina
type: Opaque
stringData:
  ADMIN_EMAIL: "<e-mail do administrador inicial>"
  # 8 a 72 caracteres.
  ADMIN_PASSWORD: "<senha do administrador inicial>"
