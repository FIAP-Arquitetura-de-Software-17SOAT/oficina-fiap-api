# Base da API: o que e igual em qualquer ambiente (kind ou EKS).
# Nao se aplica esta pasta diretamente: use um overlay (k8s/overlays/<ambiente>/app),
# que escolhe a imagem e os valores proprios de cada ambiente.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
