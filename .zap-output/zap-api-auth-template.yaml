---
env:
  contexts:
    - name: oficina-api
      urls:
        - "http://localhost:8090/api/v1"
      includePaths:
        - "http://localhost:8090/api/v1.*"
      excludePaths:
        - "http://localhost:8090/api/v1/billings/stripe/webhook.*"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: true
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true

  - type: activeScan-config
    parameters:
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20
      maxAlertsPerRule: 20

  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: oficina-api-bearer-token
        url: "http://localhost:8090/api/v1.*"
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: "Bearer @@ACCESS_TOKEN@@"

  - type: requestor
    requests:
      - url: "http://localhost:8090/api/v1/health"

  - type: openapi
    parameters:
      apiUrl: "http://localhost:8090/api/v1/docs-json"
      context: oficina-api
      targetUrl: "http://localhost:8090"

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: activeScan
    parameters:
      context: oficina-api
      url: "http://localhost:8090/api/v1"
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: "."
      reportFile: "zap-authenticated-report.html"
      reportTitle: "OWASP ZAP Authenticated Scan - Oficina FIAP API"
      reportDescription: "Authenticated ZAP scan against local NestJS API at http://localhost:8090/api/v1."

  - type: report
    parameters:
      template: traditional-json
      reportDir: "."
      reportFile: "zap-authenticated-report.json"
      reportTitle: "OWASP ZAP Authenticated Scan - Oficina FIAP API"
      reportDescription: "Authenticated ZAP scan against local NestJS API at http://localhost:8090/api/v1."
